<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gbege Free — AI Route Planner</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body, html { height: 100%; width: 100%; overflow: hidden; }
    #map { height: 100vh; width: 100vw; z-index: 1; }
    .panel {
      position: absolute; top: 16px; left: 16px; z-index: 1000;
      background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px);
      padding: 16px 20px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
      width: 320px;
    }
    h1 { font-size: 1.25rem; font-weight: 700; color: #111827; margin-bottom: 4px; }
    .tagline { font-size: 0.8rem; color: #6b7280; margin-bottom: 12px; }
    .status-msg {
      font-size: 0.825rem; color: #374151; padding: 8px; background: #f3f4f6;
      border-radius: 6px; margin-bottom: 12px; border-left: 3px solid #2563eb;
    }
    .algo-select { display: flex; gap: 6px; margin-bottom: 12px; }
    .algo-btn {
      flex: 1; padding: 8px 4px; border: 1px solid #d1d5db; background: #ffffff;
      border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer; transition: all 0.2s;
    }
    .algo-btn.active { background: #2563eb; color: white; border-color: #2563eb; }
    .stats-card {
      margin-top: 12px; padding: 10px; background: #f9fafb; border-radius: 8px;
      border: 1px solid #e5e7eb; display: none;
    }
    .stat-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-bottom: 4px; }
    .stat-val { font-weight: 600; color: #111827; }
    .btn-reset {
      width: 100%; margin-top: 10px; padding: 8px; background: #ef4444; color: white;
      border: none; border-radius: 6px; font-size: 0.8rem; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="panel">
    <h1>Gbege Free</h1>
    <p class="tagline">Hassle-free routes on Nigerian road networks</p>
    <div id="status" class="status-msg">Loading road boundaries...</div>

    <div class="algo-select">
      <button class="algo-btn" data-algo="bfs">BFS</button>
      <button class="algo-btn" data-algo="greedy">Greedy</button>
      <button class="algo-btn active" data-algo="astar">A*</button>
    </div>

    <div id="stats" class="stats-card">
      <div class="stat-row"><span>Algorithm:</span><span id="stat-algo" class="stat-val">-</span></div>
      <div class="stat-row"><span>Nodes Explored:</span><span id="stat-explored" class="stat-val">-</span></div>
      <div class="stat-row"><span>Route Distance:</span><span id="stat-dist" class="stat-val">-</span></div>
      <div class="stat-row"><span>Compute Time:</span><span id="stat-time" class="stat-val">-</span></div>
    </div>

    <button id="btn-reset" class="btn-reset">Clear Map</button>
  </div>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></script>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="app.js"></script>
</body>
</html>
